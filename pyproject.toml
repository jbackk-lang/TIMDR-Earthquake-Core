[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timdr-earthquake-core"
version = "0.1.0"
description = "Analiza sygnału sejsmicznego z jednego kanału: detekcja zdarzeń, klasyfikacja kształtu anomalii, STA/LTA zweryfikowane z ObsPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
gui = ["matplotlib>=3.5"]
verify = ["obspy>=1.4"]
real-data = ["requests>=2.28"]
topology = ["gudhi>=3.8"]
dev = ["pytest>=7.0"]

[project.scripts]
timdr-earthquake = "cli:main"

[tool.setuptools]
py-modules = [
    "timdr_core_earthquake",
    "seismic_loader",
    "catalog_core",
    "ringdown",
    "topology_features",
    "precursor_validation",
    "cli",
]
